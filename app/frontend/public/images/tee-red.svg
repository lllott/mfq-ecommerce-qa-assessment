<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">红色云感纯棉圆领 T 恤</title>
  <desc id="desc">砖红色圆领短袖 T 恤的产品插画，暖米色背景。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ece1" />
      <stop offset="0.58" stop-color="#e7ddd0" />
      <stop offset="1" stop-color="#d5c7b8" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#c75d51" />
      <stop offset="0.5" stop-color="#b94a3f" />
      <stop offset="1" stop-color="#96382f" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#5e493f" flood-opacity="0.26" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
    </filter>
  </defs>

