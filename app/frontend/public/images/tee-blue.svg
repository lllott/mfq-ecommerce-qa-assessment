<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">蓝色云感纯棉圆领 T 恤</title>
  <desc id="desc">雾蓝色圆领短袖 T 恤的产品插画，冷灰米色背景。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ec" />
      <stop offset="0.58" stop-color="#e1e4de" />
      <stop offset="1" stop-color="#c9d0cc" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#6f88a8" />
      <stop offset="0.5" stop-color="#5a7292" />
      <stop offset="1" stop-color="#445a76" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#3f4c59" flood-opacity="0.24" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="8" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
    </filter>
  </defs>

